name: Build Windows

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Download and verify FFmpeg
        shell: pwsh
        run: ./scripts/download_ffmpeg.ps1

      - name: Build executable
        shell: pwsh
        run: ./scripts/build_windows.ps1 -SkipFFmpegDownload

      - name: Upload unsigned executable
        uses: actions/upload-artifact@v4
        with:
          name: CCTVVideoDownloader-unsigned
          path: |
            dist/CCTVVideoDownloader.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
